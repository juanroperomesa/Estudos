<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tooltip</title>
<style>body{margin:0;padding:16px;background:var(--color-background-default);font-family:var(--font-sans);color:var(--color-foreground-default)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.cap{font-size:12px;font-weight:600;color:var(--color-foreground-default);margin:0 0 8px}</style>
</head>
<body>
<div id="root"></div>
<script>
var F = window.FoundationIA, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h("div",{className:"row",style:{paddingTop:"40px",gap:"48px"}},
 h(F.Tooltip,{content:"Sempre visível neste exemplo",open:true},h(F.Button,{variant:"ghost"},"Com tooltip")),
 h(F.Tooltip,{content:"Aparece no hover e no foco"},h(F.Button,{variant:"secondary"},"Passe o mouse"))));
</script>
</body>
</html>
