<!doctype html>
<html>
<head><meta charset="utf-8"><title>Input</title>
<style>body{margin:0;padding:16px;background:var(--color-background-default);font-family:var(--font-sans);color:var(--color-foreground-default)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.cap{font-size:12px;font-weight:600;color:var(--color-foreground-default);margin:0 0 8px}</style>
</head>
<body>
<div id="root"></div>
<script>
var F = window.FoundationIA, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h("div",{className:"row",style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))"}},
 h(F.Input,{label:"E-mail",placeholder:"seu@email.com"}),
 h(F.Input,{label:"E-mail",defaultValue:"john@exemplo.com",helperText:"Pressione Tab para avançar"}),
 h(F.Input,{label:"E-mail",placeholder:"campo obrigatório",error:"E-mail inválido"}),
 h(F.Input,{label:"E-mail",placeholder:"não disponível",disabled:true})));
</script>
</body>
</html>
