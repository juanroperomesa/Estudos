<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
html,body{margin:0;height:100%}
body{background:var(--color-background-default);font-family:var(--font-sans)}
.cover{position:relative;width:960px;height:288px;overflow:hidden}
svg{position:absolute;inset:0}
.slab{fill:var(--color-action-primary)}
.tint{fill:var(--color-brand-200)}
.hi{fill:var(--color-brand-highlight)}
.acc{fill:var(--color-brand-accent)}
.deep{fill:var(--color-brand-600)}
.dot{fill:var(--color-brand-200)}
.b{rx:var(--radius-lg)}
.text{position:absolute;left:40px;bottom:40px;max-width:440px}
.name{margin:0;font-size:64px;line-height:.95;font-weight:700;color:var(--color-foreground-default);letter-spacing:-0.01em}
.tag{margin:12px 0 0;font-size:14px;line-height:1.5;color:var(--color-foreground-muted)}
</style>
</head>
<body>
<div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: color-action-primary slab 160x240 (spacing-20 x spacing-24+ ...), color-brand-200 232x112, color-brand-highlight 112x112 (spacing-24+spacing-4), color-brand-accent 104x64, color-brand-600 104x32; all corners radius-lg.
arrangement: flush modular grid right of x=480 on a 16px (spacing-4) gutter, the tall action slab anchoring four satellites; the capa's five hues.
pattern: dot grid at spacing-6 (24px) pitch cut into the slab in color-brand-200 — the file registers an 8pt base grid (grid/base/8pt) and a 4px spacing scale, so a precise dot grid is this system's own texture.
scales: spacing-4 gutter, spacing-6 dot pitch, radius-lg corners.
-->
